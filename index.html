<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
    <div class="container p-4" style="max-width: 350px;">

        <div class="d-flex justify-content-center gap-2 m-4">
            <button type="button" class="btn btn-secondary">About</button>
            <button type="button" class="btn btn-info">Projects</button>
            <button type="button" class="btn btn-light border">Contact</button>
        </div>

        <p class="text-start">Izquierda</p>
        <p class="text-center text-danger">Centro</p>
        <p class="text-end">Derecha</p>

        <div class="card text-center">
            <div class="card-header">
                My Profile
            </div>
            <img src="./assets/profile.png" class="card-img-top" alt="Foto de mi Perfil">
            <div class="card-body">
                <h5 class="card-title">Evelyn Pascual</h5>
                <p class="card-text">I bring a unique "client-first" perspective to software.</p>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">Full Stack Developer</li>
                    <li class="list-group-item">Systems Engineering Student</li>
                    <li class="list-group-item">Located in Lima, Perú</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
